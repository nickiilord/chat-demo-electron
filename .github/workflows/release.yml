name: Build desktop releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            command: pnpm dist:win
          - platform: macos-arm64
            os: macos-latest
            command: pnpm dist:mac --arm64
          - platform: macos-x64
            os: macos-15-intel
            command: pnpm dist:mac --x64
          - platform: linux-x64
            os: ubuntu-latest
            command: pnpm dist:linux
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check renderer types
        run: pnpm type

      - name: Check desktop types
        run: pnpm type:electron

      - name: Build renderer and main process
        run: pnpm build:desktop

      - name: Package
        run: ${{ matrix.command }}
        env:
          # 没有签名证书，禁止 electron-builder 自动查找证书。
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
